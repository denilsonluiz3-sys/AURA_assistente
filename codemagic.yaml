# ÚNICO workflow da AURA — gere o APK Android aqui.
workflows:
  aura-mobile-apk:
    name: AURA Mobile Android (APK)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        DOTNET_PATH: $CM_BUILD_DIR/dotnet
        DOTNET_BIN: $CM_BUILD_DIR/dotnet/dotnet
        # Deve coincidir com global.json (SDK fixado e rollForward latestPatch).
        DOTNET_VERSION: "10.0.100"
        ANDROID_NDK_VERSION: "26.3.11579264"
        ANDROID_TFM: net10.0-android
        AURA_DISPLAY_VERSION: "2.4"

    scripts:
      - name: Install .NET 10
        script: |
          set -euo pipefail
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --install-dir "$DOTNET_PATH" --version "$DOTNET_VERSION"
          export PATH="$DOTNET_PATH:$PATH"
          echo "dotnet=$($DOTNET_BIN --version)"
          "$DOTNET_BIN" --list-sdks || true

      - name: Run .NET unit tests
        script: |
          set -euo pipefail
          export PATH="$DOTNET_PATH:$PATH"
          export DOTNET_ROOT="$DOTNET_PATH"
          "$DOTNET_BIN" restore tests/AURA.Tests/AURA.Tests.csproj --verbosity minimal
          "$DOTNET_BIN" test tests/AURA.Tests/AURA.Tests.csproj --no-restore --verbosity normal

      - name: Install MAUI Android workload
        script: |
          set -euo pipefail
          export PATH="$DOTNET_PATH:$PATH"
          # Garante que o SDK instalado é usado (global.json com rollForward).
          export DOTNET_ROOT="$DOTNET_PATH"
          "$DOTNET_BIN" --info
          "$DOTNET_BIN" workload install maui-android --verbosity minimal
          echo "MAUI workload: OK"

      - name: Install native Android dependencies
        script: |
          set -euo pipefail
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;$ANDROID_NDK_VERSION"
          test -d "$SDK_DIR/ndk/$ANDROID_NDK_VERSION"

      - name: Build native offline AI runtime
        script: |
          set -euo pipefail
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          NDK_ROOT="$SDK_DIR/ndk/$ANDROID_NDK_VERSION"
          git clone --depth 1 --branch v0.4.0 https://github.com/ggml-org/llama.cpp native/llama.cpp
          cmake -S native/aura-llama -B native/aura-llama/build \
            -DLLAMA_CPP_ROOT="$CM_BUILD_DIR/native/llama.cpp" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=28 \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_OPENSSL=OFF
          cmake --build native/aura-llama/build --target aura_llama --parallel 2
          mkdir -p src/AURA.Mobile/Platforms/Android/NativeLibs/arm64-v8a
          NATIVE_LIB="$(find native/aura-llama/build -type f -name 'libaura_llama.so' | head -n 1)"
          test -n "$NATIVE_LIB"
          cp "$NATIVE_LIB" src/AURA.Mobile/Platforms/Android/NativeLibs/arm64-v8a/libaura_llama.so
          ls -lh src/AURA.Mobile/Platforms/Android/NativeLibs/arm64-v8a/libaura_llama.so

      - name: Restore
        script: |
          set -euo pipefail
          export PATH="$DOTNET_PATH:$PATH"
          export DOTNET_ROOT="$DOTNET_PATH"
          "$DOTNET_BIN" restore src/AURA.Mobile/AURA.Mobile.csproj --verbosity minimal

      - name: Install Android SDK deps
        script: |
          set -euo pipefail
          export PATH="$DOTNET_PATH:$PATH"
          export DOTNET_ROOT="$DOTNET_PATH"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          "$DOTNET_BIN" build src/AURA.Mobile/AURA.Mobile.csproj \
            -t:InstallAndroidDependencies \
            -f "$ANDROID_TFM" \
            -p:AndroidSdkDirectory="$SDK_DIR" \
            -p:AcceptAndroidSDKLicenses=True \
            --verbosity minimal
          echo "Android SDK dependencies: OK"

      - name: Build APK
        script: |
          set -euo pipefail
          export PATH="$DOTNET_PATH:$PATH"
          export DOTNET_ROOT="$DOTNET_PATH"
          "$DOTNET_BIN" build src/AURA.Mobile/AURA.Mobile.csproj \
            -f "$ANDROID_TFM" \
            -c Release \
            --verbosity minimal \
            --no-restore
          echo "Build: OK"

      - name: Publish APK
        script: |
          set -euo pipefail
          export PATH="$DOTNET_PATH:$PATH"
          export DOTNET_ROOT="$DOTNET_PATH"
          OUT="$CM_BUILD_DIR/artifacts"
          mkdir -p "$OUT"

          "$DOTNET_BIN" publish src/AURA.Mobile/AURA.Mobile.csproj \
            -f "$ANDROID_TFM" \
            -c Release \
            -p:AndroidPackageFormats=apk \
            -p:ApplicationVersion="${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-24}}" \
            -p:ApplicationDisplayVersion="$AURA_DISPLAY_VERSION" \
            --verbosity minimal \
            -o "$OUT"

          echo "Publish: OK"
          echo "--- APKs em artifacts ---"
          find "$OUT" -type f -name '*.apk' -print || true

          # Fallback: bin do projeto (alguns hosts MAUI não copiam para -o)
          if ! find "$OUT" -type f -name '*.apk' | grep -q .; then
            echo "Nenhum APK em artifacts; buscando em src/AURA.Mobile/bin…"
            find src/AURA.Mobile/bin -type f -name '*.apk' -print || true
            while IFS= read -r apk; do
              cp -f "$apk" "$OUT/"
            done < <(find src/AURA.Mobile/bin -type f -name '*.apk' 2>/dev/null || true)
          fi

          echo "--- APKs finais ---"
          find "$OUT" -type f -name '*.apk' -print
          if ! find "$OUT" -type f -name '*.apk' | grep -q .; then
            echo "ERRO: nenhum .apk gerado"
            exit 1
          fi

    artifacts:
      - artifacts/**/*.apk
