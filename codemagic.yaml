# ÚNICO workflow da AURA — gere o APK Android aqui.
workflows:
  aura-mobile-apk:
    name: AURA Mobile Android (APK)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        DOTNET_PATH: $CM_BUILD_DIR/dotnet
        DOTNET_BIN: $CM_BUILD_DIR/dotnet/dotnet
        DOTNET_VERSION: "10.0.110"
        ANDROID_TFM: net10.0-android
        AURA_DISPLAY_VERSION: "2.1"

    scripts:
      - name: Install .NET 10
        script: |
          set -euo pipefail
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --install-dir "$DOTNET_PATH" --version "$DOTNET_VERSION"
          export PATH="$DOTNET_PATH:$PATH"
          echo "dotnet=$($DOTNET_BIN --version)"

      - name: Install MAUI Android workload
        script: |
          set -euo pipefail
          export PATH="$DOTNET_PATH:$PATH"
          "$DOTNET_BIN" workload install maui-android --verbosity minimal
          echo "MAUI workload: OK"

      - name: Restore
        script: |
          set -euo pipefail
          export PATH="$DOTNET_PATH:$PATH"
          "$DOTNET_BIN" restore src/AURA.Mobile/AURA.Mobile.csproj --verbosity minimal

      - name: Install Android SDK deps
        script: |
          set +e
          export PATH="$DOTNET_PATH:$PATH"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          "$DOTNET_BIN" build src/AURA.Mobile/AURA.Mobile.csproj \
            -t:InstallAndroidDependencies \
            -f "$ANDROID_TFM" \
            -p:AndroidSdkDirectory="$SDK_DIR" \
            -p:AcceptAndroidSDKLicenses=True \
            --verbosity minimal > "$CM_BUILD_DIR/android-deps.log" 2>&1
          EXIT_CODE=$?
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "Android SDK dependency installation failed. Last 120 lines:"
            tail -120 "$CM_BUILD_DIR/android-deps.log"
          else
            echo "Android SDK dependencies: OK"
          fi
          exit "$EXIT_CODE"

      - name: Build APK
        script: |
          set +e
          export PATH="$DOTNET_PATH:$PATH"
          "$DOTNET_BIN" build src/AURA.Mobile/AURA.Mobile.csproj \
            -f "$ANDROID_TFM" \
            -c Release \
            --verbosity minimal \
            --no-restore > "$CM_BUILD_DIR/build.log" 2>&1
          EXIT_CODE=$?
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "Build failed. Last 160 lines:"
            tail -160 "$CM_BUILD_DIR/build.log"
          else
            echo "Build: OK"
          fi
          exit "$EXIT_CODE"

      - name: Publish APK
        script: |
          set +e
          export PATH="$DOTNET_PATH:$PATH"
          mkdir -p "$CM_BUILD_DIR/artifacts"
          "$DOTNET_BIN" publish src/AURA.Mobile/AURA.Mobile.csproj \
            -f "$ANDROID_TFM" \
            -c Release \
            -p:AndroidPackageFormats=apk \
            -p:ApplicationVersion="${BUILD_NUMBER:-1}" \
            -p:ApplicationDisplayVersion="$AURA_DISPLAY_VERSION" \
            --verbosity minimal \
            -o "$CM_BUILD_DIR/artifacts" > "$CM_BUILD_DIR/publish.log" 2>&1
          EXIT_CODE=$?
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "Publish failed. Last 160 lines:"
            tail -160 "$CM_BUILD_DIR/publish.log"
          else
            echo "Publish: OK"
            find "$CM_BUILD_DIR/artifacts" -type f -name '*.apk' -print
          fi
          exit "$EXIT_CODE"

    artifacts:
      - artifacts/**/*.apk
      - android-deps.log
      - build.log
      - publish.log
