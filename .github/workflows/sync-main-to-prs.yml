name: Sync open PR branches with main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-prs
  cancel-in-progress: true

jobs:
  sync:
    name: Update open PR branches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sync every open PR with main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list \
            --repo "${{ github.repository }}" \
            --state open \
            --base main \
            --json number \
            --jq '.[].number' \
          | while read -r pr; do
              [ -n "$pr" ] || continue
              echo "Updating PR #$pr from main..."
              gh pr update-branch "$pr" --repo "${{ github.repository }}" --rebase || \
                echo "PR #$pr could not be updated automatically; CI will report any conflict."
            done
