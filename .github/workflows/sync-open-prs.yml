name: Sync open PRs with main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Update open PR branches
    runs-on: ubuntu-latest
    steps:
      - name: Update every open PR with main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'main',
              per_page: 100
            });

            for (const pr of prs) {
              if (pr.draft && pr.head.ref === 'main') continue;
              try {
                await github.rest.pulls.updateBranch({
                  owner,
                  repo,
                  pull_number: pr.number,
                  expected_head_sha: pr.head.sha,
                  update_method: 'merge'
                });
                core.info(`PR #${pr.number} atualizado com main.`);
              } catch (error) {
                core.warning(`PR #${pr.number} não pôde ser atualizado: ${error.message}`);
              }
            }
