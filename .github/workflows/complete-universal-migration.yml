name: Complete Universal AI Migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate-and-build:
    if: ${{ !contains(github.event.head_commit.message, 'universal-migration-complete') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.x' }
      - name: Remove legacy client references
        shell: python
        run: |
          from pathlib import Path
          root = Path('.')
          for p in root.rglob('*.cs'):
              if '.git' in p.parts or 'bin' in p.parts or 'obj' in p.parts: continue
              s = p.read_text(encoding='utf-8'); old = s
              s = s.replace('using AURA.AI.Providers;\n', '').replace('using AURA.AI.Providers;\r\n', '')
              s = s.replace('OpenRouterClient', 'IUniversalAiClient').replace('OpenRouterOptions', 'UniversalAiClientOptions')
              s = s.replace('AiApiFormat.OpenAICompletions', 'UniversalApiFormat.OpenAiCompatible').replace('AiApiFormat.AnthropicMessages', 'UniversalApiFormat.AnthropicMessages')
              s = s.replace('new IUniversalAiClient(new UniversalAiClientOptions(), _logger)', 'UniversalCliRuntime.Create()')
              if 'IUniversalAiClient' in s and 'using AURA.AI.UniversalAI;' not in s: s = 'using AURA.AI.UniversalAI;\n' + s
              if p.as_posix().endswith('AURA.CLI/Program.cs'):
                  start = s.find('        private static IUniversalAiClient EnsureAiClient(')
                  if start >= 0:
                      brace = s.find('{', start); depth = 0; end = -1
                      for i in range(brace, len(s)):
                          if s[i] == '{': depth += 1
                          elif s[i] == '}':
                              depth -= 1
                              if depth == 0: end = i + 1; break
                      if end > 0: s = s[:start] + '        private static IUniversalAiClient EnsureAiClient(string? model = null)\n        {\n            return UniversalCliRuntime.Create(model);\n        }' + s[end:]
                  s = s.replace('Environment.GetEnvironmentVariable("OPENROUTER_API_KEY")', 'Environment.GetEnvironmentVariable("AURA_API_KEY")').replace('OPENROUTER_API_KEY', 'AURA_API_KEY').replace('OpenRouter', 'provider configurado').replace('qwen/qwen-plus', 'modelo configurado')
              if p.name == 'AgentPage.xaml.cs':
                  a = s.find('    private bool HasLocalLlmWithoutKey()')
                  if a >= 0:
                      b = s.find('    private void EnsureSession()', a)
                      if b > a: s = s[:a] + '    private bool HasLocalLlmWithoutKey() => !string.IsNullOrWhiteSpace(_client.Options.BaseUrl) && string.IsNullOrWhiteSpace(_client.Options.ApiKey);\n\n' + s[b:]
              if s != old: p.write_text(s, encoding='utf-8')
          providers = Path('config/providers.json')
          if providers.exists(): providers.write_text('{\n  "providers": []\n}\n', encoding='utf-8')
      - name: Verify legacy symbols
        shell: bash
        run: |
          echo '=== LEGACY REFERENCES ==='
          grep -RniE 'OpenRouterClient|OpenRouterOptions|AiApiFormat|ProviderCatalog|ProviderInfo|OPENROUTER' src config --include='*.cs' --include='*.json' || true
          echo '=== UNIVERSAL REFERENCES ==='
          (grep -RniE 'IUniversalAiClient|UniversalAiClientFactory|UniversalRuntimeAdapter|UniversalApiFormat' src --include='*.cs' | head -120) || true
      - name: Build solution
        run: dotnet build AURA.sln --configuration Release --nologo
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then echo 'No migration changes needed.'; exit 0; fi
          git config user.name 'AURA Universal Migration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src config
          git commit -m 'chore(universal): complete universal migration [universal-migration-complete]'
          git push origin HEAD:main
