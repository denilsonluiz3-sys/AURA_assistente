name: AURA Android APK

# APK principal: Codemagic (aura-mobile-apk).
# Este workflow fica só para validação manual no GitHub quando necessário.
on:
  workflow_dispatch:

concurrency:
  group: aura-android-manual
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: tools platform-tools

      - name: Install required Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || test $? -eq 141
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264" \
            "cmdline-tools;latest"
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-36|build-tools;35.0.0|ndk;26.3.11579264' || true

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          test -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/platforms/android-36"
          test -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/build-tools/35.0.0"
          test -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/ndk/26.3.11579264"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-mobile-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-mobile-${{ runner.os }}-

      - name: Restore
        run: dotnet restore src/AURA.Mobile/AURA.Mobile.csproj

      - name: Configure release signing
        run: |
          if [ -n "${{ secrets.AURA_KEYSTORE_B64 }}" ]; then
            mkdir -p keystore
            echo "${{ secrets.AURA_KEYSTORE_B64 }}" | base64 -d > keystore/aura-release.jks
            echo "KEYSTORE_PRESENT=1" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_PRESENT=0" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        id: build
        run: |
          SIGN_ARGS=""
          if [ "${KEYSTORE_PRESENT:-0}" = "1" ]; then
            SIGN_ARGS="-p:AndroidSigningKeyStore=keystore/aura-release.jks \
              -p:AndroidSigningKeyAlias=${{ secrets.AURA_KEYSTORE_ALIAS }} \
              -p:AndroidSigningKeyPass=${{ secrets.AURA_KEYSTORE_PASS }} \
              -p:AndroidSigningStorePass=${{ secrets.AURA_KEYSTORE_PASS }} \
              -p:AndroidUseDebugSigning=false"
          fi
          dotnet build src/AURA.Mobile/AURA.Mobile.csproj \
            -c Release --no-restore \
            -p:AndroidPackageFormats=apk \
            $SIGN_ARGS

      - name: Upload APK
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aura-mobile-apk-manual-${{ github.run_id }}
          path: src/AURA.Mobile/bin/Release/net10.0-android/*.apk
          if-no-files-found: warn
          retention-days: 3
