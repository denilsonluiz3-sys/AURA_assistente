name: AURA Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '*.sln'
      - '*.props'
      - '*.targets'
      - 'global.json'
      - 'NuGet.Config'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - '*.sln'
      - '*.props'
      - '*.targets'
      - 'global.json'
      - 'NuGet.Config'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

concurrency:
  group: aura-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          ndk-version: r26d
          emulator: false
          api36: true

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-mobile-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-mobile-${{ runner.os }}-

      - name: Restore
        run: dotnet restore src/AURA.Mobile/AURA.Mobile.csproj

      - name: Configure release signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "${{ secrets.AURA_KEYSTORE_B64 }}" ]; then
            mkdir -p keystore
            echo "${{ secrets.AURA_KEYSTORE_B64 }}" | base64 -d > keystore/aura-release.jks
            echo "KEYSTORE_PRESENT=1" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_PRESENT=0" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        id: build
        run: |
          SIGN_ARGS=""
          if [ "${KEYSTORE_PRESENT:-0}" = "1" ]; then
            SIGN_ARGS="-p:AndroidSigningKeyStore=keystore/aura-release.jks \
              -p:AndroidSigningKeyAlias=${{ secrets.AURA_KEYSTORE_ALIAS }} \
              -p:AndroidSigningKeyPass=${{ secrets.AURA_KEYSTORE_PASS }} \
              -p:AndroidSigningStorePass=${{ secrets.AURA_KEYSTORE_PASS }} \
              -p:AndroidUseDebugSigning=false"
          fi
          dotnet build src/AURA.Mobile/AURA.Mobile.csproj \
            -c Release --no-restore \
            -p:AndroidPackageFormats=apk \
            $SIGN_ARGS

      # Quota de storage do Actions esgota com frequência; não deve marcar o job
      # como falha de código (build já terminou com 0 erros).
      - name: Upload APK
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aura-mobile-apk-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}-${{ github.run_id }}
          path: src/AURA.Mobile/bin/Release/net10.0-android/*.apk
          if-no-files-found: warn
          retention-days: 2
