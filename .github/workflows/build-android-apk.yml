name: AURA Android APK

# Caminho oficial do APK (Codemagic esgotou builds).
# O APK é validado automaticamente a cada atualização da branch main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aura-android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  AURA_DISPLAY_VERSION: "2.4"

permissions:
  contents: read
  actions: write

jobs:
  unit-tests:
    name: .NET unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-tests-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-tests-${{ runner.os }}-
            nuget-mobile-${{ runner.os }}-

      - name: Restore tests
        run: dotnet restore tests/AURA.Tests/AURA.Tests.csproj

      - name: Run tests
        run: dotnet test tests/AURA.Tests/AURA.Tests.csproj --no-restore --verbosity minimal

  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          # SDK fixado; global.json permite apenas latestPatch.
          dotnet-version: |
            10.0.100

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719

      - name: Install required Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager fecha o pipe ao terminar; yes recebe SIGPIPE (exit 141).
          # Com pipefail isso derrubava o step — toleramos o exit do yes.
          set +o pipefail
          yes 2>/dev/null | sdkmanager --licenses >/dev/null 2>&1 || true
          set -o pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264"
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-36|build-tools;35.0.0|ndk;26.3.11579264' || true

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          test -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/platforms/android-36"
          test -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/build-tools/35.0.0"
          test -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/ndk/26.3.11579264"

      - name: Build native offline AI runtime
        shell: bash
        run: |
          set -euo pipefail
          NDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/ndk/26.3.11579264"
          git clone --depth 1 --branch v0.4.0 https://github.com/ggml-org/llama.cpp native/llama.cpp
          cmake -S native/aura-llama -B native/aura-llama/build \
            -DLLAMA_CPP_ROOT="$GITHUB_WORKSPACE/native/llama.cpp" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=28 \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_OPENSSL=OFF
          cmake --build native/aura-llama/build --target aura_llama --parallel 2
          mkdir -p src/AURA.Mobile/Platforms/Android/NativeLibs/arm64-v8a
          NATIVE_LIB=$(find native/aura-llama/build -type f -name 'libaura_llama.so' | head -n 1)
          test -n "$NATIVE_LIB"
          cp "$NATIVE_LIB" src/AURA.Mobile/Platforms/Android/NativeLibs/arm64-v8a/libaura_llama.so
          ls -lh src/AURA.Mobile/Platforms/Android/NativeLibs/arm64-v8a/libaura_llama.so

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-mobile-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-mobile-${{ runner.os }}-

      - name: Restore
        run: dotnet restore src/AURA.Mobile/AURA.Mobile.csproj

      - name: Configure release signing
        run: |
          if [ -n "${{ secrets.AURA_KEYSTORE_B64 }}" ]; then
            mkdir -p keystore
            echo "${{ secrets.AURA_KEYSTORE_B64 }}" | base64 -d > keystore/aura-release.jks
            echo "KEYSTORE_PRESENT=1" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_PRESENT=0" >> "$GITHUB_ENV"
            echo "::warning::Secrets de keystore ausentes — APK será assinado com a chave debug apenas para validação manual"
          fi

      - name: Publish APK
        id: publish
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$OUT"

          SIGN_ARGS=""
          if [ "${KEYSTORE_PRESENT:-0}" = "1" ]; then
            SIGN_ARGS="-p:AndroidSigningKeyStore=keystore/aura-release.jks \
              -p:AndroidSigningKeyAlias=${{ secrets.AURA_KEYSTORE_ALIAS }} \
              -p:AndroidSigningKeyPass=${{ secrets.AURA_KEYSTORE_PASS }} \
              -p:AndroidSigningStorePass=${{ secrets.AURA_KEYSTORE_PASS }} \
              -p:AndroidUseDebugSigning=false"
          else
            # Um APK sem assinatura é rejeitado pelo instalador Android como inválido.
            # Sem o keystore de release, gere um APK debug-assinado apenas para testes.
            SIGN_ARGS="-p:AndroidUseDebugSigning=true"
          fi

          dotnet publish src/AURA.Mobile/AURA.Mobile.csproj \
            -f net10.0-android \
            -c Release \
            --no-restore \
            -p:AndroidPackageFormats=apk \
            -p:ApplicationVersion="${{ github.run_number }}" \
            -p:ApplicationDisplayVersion="$AURA_DISPLAY_VERSION" \
            $SIGN_ARGS \
            -o "$OUT"

          echo "--- APKs em artifacts ---"
          find "$OUT" -type f -name '*.apk' -print || true

          # Fallback: bin do projeto
          if ! find "$OUT" -type f -name '*.apk' | grep -q .; then
            echo "Nenhum APK em artifacts; buscando em src/AURA.Mobile/bin…"
            while IFS= read -r apk; do
              cp -f "$apk" "$OUT/"
            done < <(find src/AURA.Mobile/bin -type f -name '*.apk' 2>/dev/null || true)
          fi

          echo "--- APKs finais ---"
          find "$OUT" -type f -name '*.apk' -print
          if ! find "$OUT" -type f -name '*.apk' | grep -q .; then
            echo "ERRO: nenhum .apk gerado"
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          SIGNED_APK=$(find "$OUT" -type f -iname '*-Signed.apk' | head -n 1 || true)
          if [ -z "$SIGNED_APK" ]; then
            while IFS= read -r candidate; do
              if "$APKSIGNER" verify "$candidate" >/dev/null 2>&1; then SIGNED_APK="$candidate"; break; fi
            done < <(find "$OUT" -type f -name '*.apk')
          fi
          if [ -z "$SIGNED_APK" ]; then echo "ERRO: nenhum APK assinado encontrado"; exit 1; fi
          FINAL_APK="$OUT/com.aura.genesis-Signed.apk"
          if [ "$SIGNED_APK" != "$FINAL_APK" ]; then
            cp -f "$SIGNED_APK" "$FINAL_APK"
          fi
          find "$OUT" -type f -name '*.apk' ! -path "$FINAL_APK" -delete
          APK="$FINAL_APK"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "package: name='com.aura.genesis'" "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "versionName='2.4'" "$RUNNER_TEMP/apk-badging.txt"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -l "$APK" | grep -Fq "lib/arm64-v8a/libaura_llama.so"

      - name: Upload APK
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: aura-mobile-apk-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Delete previous APK artifacts
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const keep = `aura-mobile-apk-${context.runId}`;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            for (const artifact of artifacts) {
              if (artifact.name.startsWith('aura-mobile-apk-') && artifact.name !== keep) {
                core.info(`Excluindo artefato antigo: ${artifact.name} (${artifact.id})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }

