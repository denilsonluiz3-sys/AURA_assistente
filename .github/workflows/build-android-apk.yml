name: AURA Android APK

# Caminho oficial do APK (Codemagic esgotou builds).
# Disparo: manual ou push na main.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/AURA.Mobile/**"
      - "src/AURA.*/**"
      - ".github/workflows/build-android-apk.yml"
      - "global.json"
      - "NuGet.Config"
      - "AURA.sln"

concurrency:
  group: aura-android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  AURA_DISPLAY_VERSION: "2.4"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: tools platform-tools

      - name: Install required Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264" \
            "cmdline-tools;latest"
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-36|build-tools;35.0.0|ndk;26.3.11579264' || true

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          test -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/platforms/android-36"
          test -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/build-tools/35.0.0"
          test -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/ndk/26.3.11579264"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-mobile-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-mobile-${{ runner.os }}-

      - name: Restore
        run: dotnet restore src/AURA.Mobile/AURA.Mobile.csproj

      - name: Configure release signing
        run: |
          if [ -n "${{ secrets.AURA_KEYSTORE_B64 }}" ]; then
            mkdir -p keystore
            echo "${{ secrets.AURA_KEYSTORE_B64 }}" | base64 -d > keystore/aura-release.jks
            echo "KEYSTORE_PRESENT=1" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_PRESENT=0" >> "$GITHUB_ENV"
            echo "::warning::Secrets de keystore ausentes — APK será gerado sem assinatura de release"
          fi

      - name: Publish APK
        id: publish
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$OUT"

          SIGN_ARGS=""
          if [ "${KEYSTORE_PRESENT:-0}" = "1" ]; then
            SIGN_ARGS="-p:AndroidSigningKeyStore=keystore/aura-release.jks \
              -p:AndroidSigningKeyAlias=${{ secrets.AURA_KEYSTORE_ALIAS }} \
              -p:AndroidSigningKeyPass=${{ secrets.AURA_KEYSTORE_PASS }} \
              -p:AndroidSigningStorePass=${{ secrets.AURA_KEYSTORE_PASS }} \
              -p:AndroidUseDebugSigning=false"
          fi

          dotnet publish src/AURA.Mobile/AURA.Mobile.csproj \
            -f net10.0-android \
            -c Release \
            --no-restore \
            -p:AndroidPackageFormats=apk \
            -p:ApplicationVersion="${{ github.run_number }}" \
            -p:ApplicationDisplayVersion="$AURA_DISPLAY_VERSION" \
            $SIGN_ARGS \
            -o "$OUT"

          echo "--- APKs em artifacts ---"
          find "$OUT" -type f -name '*.apk' -print || true

          # Fallback: bin do projeto
          if ! find "$OUT" -type f -name '*.apk' | grep -q .; then
            echo "Nenhum APK em artifacts; buscando em src/AURA.Mobile/bin…"
            while IFS= read -r apk; do
              cp -f "$apk" "$OUT/"
            done < <(find src/AURA.Mobile/bin -type f -name '*.apk' 2>/dev/null || true)
          fi

          echo "--- APKs finais ---"
          find "$OUT" -type f -name '*.apk' -print
          if ! find "$OUT" -type f -name '*.apk' | grep -q .; then
            echo "ERRO: nenhum .apk gerado"
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aura-mobile-apk-${{ github.run_number }}
          path: artifacts/**/*.apk
          if-no-files-found: error
          retention-days: 14
