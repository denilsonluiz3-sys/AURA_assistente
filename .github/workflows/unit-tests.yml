name: AURA Unit Tests

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.props'
      - '*.targets'
      - 'global.json'
      - 'Directory.*'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.props'
      - '*.targets'
      - 'global.json'
      - 'Directory.*'
      - '.github/workflows/unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: .NET unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100
      - name: Restore
        run: dotnet restore tests/AURA.Tests/AURA.Tests.csproj
      - name: Test
        run: dotnet test tests/AURA.Tests/AURA.Tests.csproj --no-restore --verbosity normal
