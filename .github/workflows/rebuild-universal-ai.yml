          csproj = root / "src/AURA.AI/AURA.AI.csproj"
          text = csproj.read_text(encoding="utf-8")
          text = re.sub(r'\s*<!-- Catálogo de provedores/modelos.*?</ItemGroup>\s*', '\n', text, flags=re.S)
          csproj.write_text(text, encoding="utf-8")

          # CLI: generic environment configuration only; no provider/model default.
          program = root / "src/AURA.CLI/Program.cs"
          text = program.read_text(encoding="utf-8")
          text = text.replace('Environment.GetEnvironmentVariable("OPENROUTER_API_KEY")', 'Environment.GetEnvironmentVariable("AURA_API_KEY")')
          text = text.replace('Environment.GetEnvironmentVariable("AURA_OPENROUTER_KEY")', 'Environment.GetEnvironmentVariable("AURA_API_KEY")')
          text = text.replace('"qwen/qwen-plus"', 'string.Empty')
          text = text.replace('"gpt-5-mini"', 'string.Empty')
          text = text.replace('"sk-or-..."', '"<api-key>"')
          text = text.replace('"OPENROUTER_API_KEY"', '"AURA_API_KEY"')
          program.write_text(text, encoding="utf-8")

          # Mobile DI: start with an empty client; RuntimeConfig supplies the user's choice.
          maui = root / "src/AURA.Mobile/MauiProgram.cs"
          text = maui.read_text(encoding="utf-8")
          text = re.sub(r'\s*builder\.Services\.AddSingleton\(sp => new AiClient\(new AiClientOptions \{.*?\}, sp\.GetRequiredService<ILogger>\(\)\)\);', '\n        builder.Services.AddSingleton(sp => new AiClient(new AiClientOptions(), sp.GetRequiredService<ILogger>()));', text, flags=re.S)
          maui.write_text(text, encoding="utf-8")

          # Module metadata must describe capability, not a vendor.
          for path in [root / "modules/packages/ai/module.json"]:
              if path.exists():
                  data = path.read_text(encoding="utf-8").replace("Assistente inteligente: chat com a IA (OpenRouter) e agente de arquivos com ferramentas.", "Assistente inteligente: conexão configurável com um provedor de IA e agente de arquivos com ferramentas.")
                  path.write_text(data, encoding="utf-8")
          module_catalog = root / "src/AURA.Modules/ModuleCatalog.cs"
          if module_catalog.exists():
              data = module_catalog.read_text(encoding="utf-8").replace("OpenRouterClient", "AiClient")
              module_catalog.write_text(data, encoding="utf-8")

          print("Universal AI source reconstruction written.")

      - name: Build solution
        run: dotnet build AURA.sln --configuration Release --no-restore

      - name: Verify vendor-neutral source
        shell: bash
        run: |
          if grep -RniE 'OpenRouter|OPENROUTER|qwen/qwen-plus|gpt-5-mini|127\.0\.0\.1:1143[0-9]' src config modules tests --exclude-dir=bin --exclude-dir=obj; then
            echo "Vendor-specific reference remains in source."
            exit 1
          fi

      - name: Commit reconstructed source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "refactor(ai): make provider runtime fully user-configurable"
          git push origin HEAD:${GITHUB_REF_NAME}
