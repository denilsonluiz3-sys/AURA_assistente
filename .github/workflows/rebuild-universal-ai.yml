          (root / "src/AURA.AI/UniversalAI/UniversalAiClientFactory.cs").write_text(r'''namespace AURA.AI.UniversalAI;

public static class UniversalAiClientFactory
{
    public static AiClient Create(UniversalConnection connection, int maxTokens = 1500, int timeoutSeconds = 90)
    {
        if (connection is null) throw new ArgumentNullException(nameof(connection));
        var provider = connection.Provider ?? throw new ArgumentException("Configuração do provedor obrigatória.", nameof(connection));
        if (provider.RequiresApiKey && string.IsNullOrWhiteSpace(connection.ApiKey))
            throw new ArgumentException("API key obrigatória para o provedor configurado.", nameof(connection));
        if (string.IsNullOrWhiteSpace(connection.Model)) throw new ArgumentException("Modelo obrigatório.", nameof(connection));
        if (string.IsNullOrWhiteSpace(provider.BaseUrl)) throw new ArgumentException("Endpoint obrigatório.", nameof(connection));

        return new AiClient(new AiClientOptions
        {
            Provider = provider.Id,
            ApiKey = connection.ApiKey,
            BaseUrl = provider.BaseUrl,
            ModelsUrl = provider.ModelsUrl,
            Model = connection.Model,
            MaxTokens = maxTokens,
            TimeoutSeconds = timeoutSeconds,
            ApiFormat = provider.Format,
            AuthHeaderName = provider.AuthHeader,
            AuthScheme = provider.AuthScheme,
            ApiKeyLocation = provider.ApiKeyLocation,
            ApiKeyQueryParameter = provider.ApiKeyQueryParameter,
            HeadersJson = provider.HeadersJson
        });
    }
}
