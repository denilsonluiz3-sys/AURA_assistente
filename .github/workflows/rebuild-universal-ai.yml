using AURA.Memory;

namespace AURA.AI;

public sealed class AiAssistant
{
    private readonly AiClient _client;
    private readonly MemoryStore _memory;
    private readonly ILogger _logger;

    public AiAssistant(AiClient client, MemoryStore memory, ILogger? logger = null)
    {
        _client = client ?? throw new ArgumentNullException(nameof(client));
        _memory = memory ?? throw new ArgumentNullException(nameof(memory));
        _logger = logger ?? new ConsoleLogger();
    }

    public async Task<string> AskAsync(string question, HttpClient? httpClient = null, CancellationToken ct = default)
    {
        _memory.Append(MemoryEntry.Question(question));
        string answer = await _client.ChatAsync(question, httpClient, ct).ConfigureAwait(false);
        _memory.Append(MemoryEntry.Answer(answer));
        _logger.Info("IA: pergunta registrada e respondida.");
        return answer;
    }
}
