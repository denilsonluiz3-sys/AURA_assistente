name: Rebuild Universal AI Runtime

on:
  push:
    branches:
      - migration/universal-ai-clean

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Rebuild provider/model layer
        shell: python
        run: |
          import json
          import os
          import pathlib
          import re
          import subprocess

          root = pathlib.Path.cwd()

          # Mechanical cleanup: the runtime no longer has a vendor-specific client/options type.
          replacements = {
              "OpenRouterClient": "AiClient",
              "OpenRouterOptions": "AiClientOptions",
              "AURA_OPENROUTER_KEY": "AURA_API_KEY",
              "AURA.AI.Providers": "AURA.AI.UniversalAI",
          }
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix.lower() not in {".cs", ".csproj", ".json", ".xaml", ".md", ".yml", ".yaml"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding="utf-8")

          # Remove the old provider catalog. AURA must not ship a list of vendors/models.
          for path in [root / "config/providers.json", root / "src/AURA.AI/UniversalAI/UniversalProviderRegistry.cs"]:
              if path.exists():
                  path.unlink()

          # Generic provider model: no vendor names, URLs, models or credentials are embedded.
          (root / "src/AURA.AI/UniversalAI/UniversalProvider.cs").write_text(r'''namespace AURA.AI.UniversalAI;

public enum UniversalApiFormat
{
    OpenAiCompatible,
    AnthropicMessages,
    GeminiGenerateContent
}

public enum UniversalApiKeyLocation
{
    Header,
    Query,
    None
}

public sealed record UniversalProvider(
    string Id,
    string Name,
    string BaseUrl,
    string ModelsUrl,
    UniversalApiFormat Format = UniversalApiFormat.OpenAiCompatible,
    string AuthHeader = "Authorization",
    string AuthScheme = "Bearer",
    bool RequiresApiKey = true,
    UniversalApiKeyLocation ApiKeyLocation = UniversalApiKeyLocation.Header,
    string ApiKeyQueryParameter = "key",
    string HeadersJson = "{}");

public sealed record UniversalModel(string Id, string DisplayName, string ProviderId, string? OwnedBy = null);

public sealed record UniversalConnection(UniversalProvider Provider, string ApiKey, string Model);
''', encoding="utf-8")

          (root / "src/AURA.AI/UniversalAI/UniversalRuntimeAdapter.cs").write_text(r'''namespace AURA.AI.UniversalAI;

public static class UniversalRuntimeAdapter
{
    public static UniversalConnection CreateConnection(
        string providerId,
        string providerName,
        string apiKey,
        string model,
        string baseUrl,
        string modelsUrl,
        UniversalApiFormat format,
        string authHeader,
        string authScheme,
        UniversalApiKeyLocation keyLocation,
        string keyQueryParameter,
        string headersJson)
    {
        if (string.IsNullOrWhiteSpace(providerId)) throw new ArgumentException("Identificador do provedor obrigatório.", nameof(providerId));
        if (string.IsNullOrWhiteSpace(providerName)) providerName = providerId;
        if (string.IsNullOrWhiteSpace(model)) throw new ArgumentException("Modelo obrigatório.", nameof(model));
        if (string.IsNullOrWhiteSpace(baseUrl)) throw new ArgumentException("Endpoint obrigatório.", nameof(baseUrl));
        if (string.IsNullOrWhiteSpace(modelsUrl)) throw new ArgumentException("Endpoint de modelos obrigatório.", nameof(modelsUrl));

        var provider = new UniversalProvider(
            providerId.Trim(), providerName.Trim(), baseUrl.Trim(), modelsUrl.Trim(), format,
            string.IsNullOrWhiteSpace(authHeader) ? "Authorization" : authHeader.Trim(),
            authScheme?.Trim() ?? string.Empty,
            keyLocation != UniversalApiKeyLocation.None,
            keyLocation,
            string.IsNullOrWhiteSpace(keyQueryParameter) ? "key" : keyQueryParameter.Trim(),
            string.IsNullOrWhiteSpace(headersJson) ? "{}" : headersJson.Trim());

        return new UniversalConnection(provider, apiKey?.Trim() ?? string.Empty, model.Trim());
    }
}
