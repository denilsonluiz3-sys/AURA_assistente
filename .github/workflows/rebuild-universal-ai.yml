          (root / "src/AURA.AI/AgentSession.cs").write_text(r'''using System.Text;
using AURA.Core.Logging;
using AURA.Memory;

namespace AURA.AI;

public sealed class AgentSession
{
    private readonly int _maxRounds;
    private readonly AiClient _client;
    private readonly ILogger _logger;
    private readonly List<AgentTool> _tools;
    private readonly List<AgentMessage> _messages = new();
    private readonly string? _systemPrompt;
    private readonly MemoryStore? _memory;

    public AgentSession(AiClient client, IEnumerable<AgentTool> tools, string? systemPrompt = null, ILogger? logger = null, MemoryStore? memory = null, int maxRounds = 12)
    {
        _client = client ?? throw new ArgumentNullException(nameof(client));
        _tools = (tools ?? Enumerable.Empty<AgentTool>()).ToList();
        _systemPrompt = systemPrompt;
        _logger = logger ?? new ConsoleLogger();
        _memory = memory;
        _maxRounds = Math.Max(1, maxRounds);
    }

    public event Action<AgentStep>? Step;
    public IReadOnlyList<AgentMessage> Messages => _messages;

    public async Task<string> RunAsync(string userText, HttpClient? httpClient = null, CancellationToken ct = default)
    {
        if (string.IsNullOrWhiteSpace(userText)) throw new ArgumentException("A instrução não pode ser vazia.", nameof(userText));
        _messages.Add(new AgentMessage { Role = "user", Content = userText });
        _memory?.Append(MemoryEntry.Question(userText));

        for (int round = 0; round < _maxRounds; round++)
        {
            var response = await _client.ChatToolsAsync(_messages.ToArray(), _tools.Select(t => t.Definition).ToList(), httpClient, ct, BuildSystemPrompt()).ConfigureAwait(false);
            if (!string.IsNullOrWhiteSpace(response.Error)) throw new AgentLlmException(response.Error, response.ErrorKind);
            if (response.ToolCalls is not { Count: > 0 })
            {
                string answer = response.Content ?? string.Empty;
                _memory?.Append(MemoryEntry.Answer(answer));
                return answer;
            }

            _messages.Add(new AgentMessage { Role = "assistant", Content = response.Content, ToolCalls = response.ToolCalls });
            foreach (var call in response.ToolCalls)
            {
                ct.ThrowIfCancellationRequested();
                AgentTool? tool = _tools.FirstOrDefault(t => string.Equals(t.Definition.Name, call.Name, StringComparison.OrdinalIgnoreCase));
                string result;
                bool success = true;
                if (tool is null)
                {
                    result = "ERRO: ferramenta não encontrada: " + call.Name;
                    success = false;
                }
                else
                {
                    try { result = await tool.ExecuteAsync(call.ArgumentsJson, ct).ConfigureAwait(false); }
                    catch (Exception ex) { result = "ERRO: " + ex.Message; success = false; _logger.Error(ex.ToString()); }
                }
                _messages.Add(new AgentMessage { Role = "tool", ToolCallId = call.Id, Content = result });
                Step?.Invoke(new AgentStep(call.Name, call.ArgumentsJson, result, success));
            }
        }
        throw new AgentLlmException("O agente atingiu o limite de rodadas sem produzir uma resposta final.", AgentErrorKind.Unknown);
    }

    private string BuildSystemPrompt()
    {
        var sb = new StringBuilder();
        if (!string.IsNullOrWhiteSpace(_systemPrompt)) sb.Append(_systemPrompt.Trim());
        if (_tools.Count > 0)
        {
            sb.Append("\n\nFERRAMENTAS DISPONÍVEIS:\n");
            foreach (var tool in _tools)
                sb.Append("- ").Append(tool.Definition.Name).Append(": ").Append(tool.Definition.Description).Append('\n');
        }
        return sb.ToString();
    }
}
