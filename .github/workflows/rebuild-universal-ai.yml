          (root / "src/AURA.AI/UniversalAI/UniversalModelDiscovery.cs").write_text(r'''using System.Text.Json;

namespace AURA.AI.UniversalAI;

public sealed class UniversalModelDiscovery
{
    private readonly HttpClient _http;
    public UniversalModelDiscovery(HttpClient http) => _http = http ?? throw new ArgumentNullException(nameof(http));

    public async Task<IReadOnlyList<UniversalModel>> LoadAsync(UniversalProvider provider, string apiKey, CancellationToken ct = default)
    {
        if (provider is null) throw new ArgumentNullException(nameof(provider));
        if (string.IsNullOrWhiteSpace(provider.ModelsUrl)) throw new InvalidOperationException("Endpoint de modelos não configurado.");

        using var request = new HttpRequestMessage(HttpMethod.Get, AddApiKey(provider.ModelsUrl, provider, apiKey));
        ApplyHeaders(request, provider, apiKey);
        using var response = await _http.SendAsync(request, HttpCompletionOption.ResponseHeadersRead, ct).ConfigureAwait(false);
        string body = await response.Content.ReadAsStringAsync(ct).ConfigureAwait(false);
        if (!response.IsSuccessStatusCode)
            throw new HttpRequestException($"Falha ao carregar modelos: {(int)response.StatusCode} {response.ReasonPhrase}. {body[..Math.Min(body.Length, 500)]}");
        return Parse(provider.Id, body);
    }

    private static string AddApiKey(string url, UniversalProvider provider, string key)
    {
        if (provider.ApiKeyLocation != UniversalApiKeyLocation.Query || string.IsNullOrWhiteSpace(key)) return url;
        string separator = url.Contains('?') ? "&" : "?";
        return url + separator + Uri.EscapeDataString(provider.ApiKeyQueryParameter) + "=" + Uri.EscapeDataString(key);
    }

    private static void ApplyHeaders(HttpRequestMessage request, UniversalProvider provider, string key)
    {
        if (provider.ApiKeyLocation == UniversalApiKeyLocation.Header && !string.IsNullOrWhiteSpace(key))
            request.Headers.TryAddWithoutValidation(provider.AuthHeader, string.IsNullOrWhiteSpace(provider.AuthScheme) ? key : provider.AuthScheme + " " + key);
        try
        {
            using var doc = JsonDocument.Parse(provider.HeadersJson ?? "{}");
            if (doc.RootElement.ValueKind == JsonValueKind.Object)
                foreach (var p in doc.RootElement.EnumerateObject())
                    if (p.Value.ValueKind == JsonValueKind.String)
                        request.Headers.TryAddWithoutValidation(p.Name, p.Value.GetString());
        }
        catch (JsonException) { }
    }

    private static IReadOnlyList<UniversalModel> Parse(string providerId, string json)
    {
        using var doc = JsonDocument.Parse(json);
        var root = doc.RootElement;
        var result = new List<UniversalModel>();
        JsonElement collection = root;
        if (root.ValueKind == JsonValueKind.Object)
        {
            if (root.TryGetProperty("data", out var data)) collection = data;
            else if (root.TryGetProperty("models", out var models)) collection = models;
        }
        if (collection.ValueKind != JsonValueKind.Array) return result;
        foreach (var item in collection.EnumerateArray())
        {
            string? id = null;
            string? owned = null;
            if (item.ValueKind == JsonValueKind.String) id = item.GetString();
            else if (item.ValueKind == JsonValueKind.Object)
            {
                if (item.TryGetProperty("id", out var idNode)) id = idNode.GetString();
                if (string.IsNullOrWhiteSpace(id) && item.TryGetProperty("name", out var nameNode)) id = nameNode.GetString();
                if (item.TryGetProperty("owned_by", out var ownerNode)) owned = ownerNode.GetString();
            }
            if (!string.IsNullOrWhiteSpace(id)) result.Add(new UniversalModel(id!, id!, providerId, owned));
        }
        return result.OrderBy(x => x.DisplayName, StringComparer.OrdinalIgnoreCase).ToArray();
    }
}
