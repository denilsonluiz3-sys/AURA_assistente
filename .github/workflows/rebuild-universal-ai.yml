          (root / "src/AURA.AI/AiAssistantService.cs").write_text(r'''using AURA.Core.Logging;
using AURA.Memory;

namespace AURA.AI;

public static class AiAssistantService
{
    public static async Task<string> AskAsync(string question, MemoryStore? memory = null, ILogger? logger = null, AiClientOptions? options = null, HttpClient? http = null)
    {
        if (string.IsNullOrWhiteSpace(question)) throw new ArgumentException("A pergunta não pode ser vazia.", nameof(question));
        var client = new AiClient(options ?? throw new InvalidOperationException("A configuração do provedor não foi fornecida."), logger);
        if (memory != null) memory.Append(MemoryEntry.Question(question));
        string answer = await client.ChatAsync(question, http).ConfigureAwait(false);
        memory?.Append(MemoryEntry.Answer(answer));
        return answer;
    }
}
