          (root / "src/AURA.AI/AiClient.cs").write_text(r'''using System.Net;
using System.Net.Http.Headers;
using System.Text;
using System.Text.Json;
using AURA.Core.Logging;

namespace AURA.AI;

public sealed class AiClientOptions
{
    public string Provider { get; set; } = string.Empty;
    public string ApiKey { get; set; } = string.Empty;
    public string BaseUrl { get; set; } = string.Empty;
    public string ModelsUrl { get; set; } = string.Empty;
    public string Model { get; set; } = string.Empty;
    public int MaxTokens { get; set; } = 1500;
    public int TimeoutSeconds { get; set; } = 90;
    public UniversalAI.UniversalApiFormat ApiFormat { get; set; } = UniversalAI.UniversalApiFormat.OpenAiCompatible;
    public string AuthHeaderName { get; set; } = "Authorization";
    public string AuthScheme { get; set; } = "Bearer";
    public UniversalAI.UniversalApiKeyLocation ApiKeyLocation { get; set; } = UniversalAI.UniversalApiKeyLocation.Header;
    public string ApiKeyQueryParameter { get; set; } = "key";
    public string HeadersJson { get; set; } = "{}";
    public string AppReference { get; set; } = "AURA";
}

public sealed class AiClient
{
    public AiClientOptions Options { get; }
    private readonly ILogger _logger;

    public AiClient(AiClientOptions options, ILogger? logger = null)
    {
        Options = options ?? throw new ArgumentNullException(nameof(options));
        _logger = logger ?? new ConsoleLogger();
    }

    public async Task<string> ChatAsync(string question, HttpClient? httpClient = null, CancellationToken ct = default)
        => await ChatAsync(question, null, httpClient, ct).ConfigureAwait(false);

    public async Task<string> ChatAsync(string question, string? systemPrompt = null, HttpClient? httpClient = null, CancellationToken ct = default)
    {
        if (string.IsNullOrWhiteSpace(question)) throw new ArgumentException("A pergunta não pode ser vazia.", nameof(question));
        var messages = new List<AgentMessage>();
        if (!string.IsNullOrWhiteSpace(systemPrompt)) messages.Add(new AgentMessage { Role = "system", Content = systemPrompt });
        messages.Add(new AgentMessage { Role = "user", Content = question });
        AgentChatResponse response = await SendAsync(messages, null, httpClient, ct).ConfigureAwait(false);
        if (!string.IsNullOrWhiteSpace(response.Error)) throw new AgentLlmException(response.Error, response.ErrorKind);
        return response.Content ?? string.Empty;
    }

    public async Task<AgentChatResponse> ChatToolsAsync(IReadOnlyList<AgentMessage> messages, IReadOnlyList<AgentToolDefinition> tools, HttpClient? httpClient = null, CancellationToken ct = default, string? systemPrompt = null)
    {
        var all = new List<AgentMessage>();
        if (!string.IsNullOrWhiteSpace(systemPrompt)) all.Add(new AgentMessage { Role = "system", Content = systemPrompt });
        all.AddRange(messages);
        return await SendAsync(all, tools, httpClient, ct).ConfigureAwait(false);
    }

    private async Task<AgentChatResponse> SendAsync(IReadOnlyList<AgentMessage> messages, IReadOnlyList<AgentToolDefinition>? tools, HttpClient? httpClient, CancellationToken ct)
    {
        EnsureConfigured();
        using var client = httpClient is null ? new HttpClient() : null;
        HttpClient http = httpClient ?? client!;
        http.Timeout = TimeSpan.FromSeconds(Math.Clamp(Options.TimeoutSeconds, 5, 600));
        try
        {
            using var request = BuildRequest(messages, tools);
            using HttpResponseMessage response = await http.SendAsync(request, HttpCompletionOption.ResponseHeadersRead, ct).ConfigureAwait(false);
            string body = await response.Content.ReadAsStringAsync(ct).ConfigureAwait(false);
            if (!response.IsSuccessStatusCode)
                return new AgentChatResponse { Error = $"Falha na chamada LLM ({(int)response.StatusCode} {response.StatusCode}): {body}", ErrorKind = Classify(response.StatusCode) };
            return ParseResponse(body);
        }
        catch (OperationCanceledException) when (!ct.IsCancellationRequested)
        {
            return new AgentChatResponse { Error = "Tempo limite excedido ao chamar o provedor configurado.", ErrorKind = AgentErrorKind.Timeout };
        }
        catch (HttpRequestException ex)
        {
            _logger.Error("LLM network error: " + ex.Message);
            return new AgentChatResponse { Error = ex.Message, ErrorKind = AgentErrorKind.Network };
        }
    }

    private HttpRequestMessage BuildRequest(IReadOnlyList<AgentMessage> messages, IReadOnlyList<AgentToolDefinition>? tools)
    {
        string url = Options.BaseUrl.Trim();
        if (Options.ApiFormat == UniversalAI.UniversalApiFormat.GeminiGenerateContent)
            url = url.Replace("{model}", Uri.EscapeDataString(Options.Model), StringComparison.Ordinal);

        if (Options.ApiKeyLocation == UniversalAI.UniversalApiKeyLocation.Query && !string.IsNullOrWhiteSpace(Options.ApiKey))
            url += (url.Contains('?') ? "&" : "?") + Uri.EscapeDataString(Options.ApiKeyQueryParameter) + "=" + Uri.EscapeDataString(Options.ApiKey);

        var request = new HttpRequestMessage(HttpMethod.Post, url);
        if (Options.ApiKeyLocation == UniversalAI.UniversalApiKeyLocation.Header && !string.IsNullOrWhiteSpace(Options.ApiKey))
        {
            string value = string.IsNullOrWhiteSpace(Options.AuthScheme) ? Options.ApiKey : Options.AuthScheme + " " + Options.ApiKey;
            request.Headers.TryAddWithoutValidation(Options.AuthHeaderName, value);
        }
        ApplyCustomHeaders(request);
        object payload = Options.ApiFormat switch
        {
            UniversalAI.UniversalApiFormat.AnthropicMessages => BuildAnthropicPayload(messages),
            UniversalAI.UniversalApiFormat.GeminiGenerateContent => BuildGeminiPayload(messages),
            _ => BuildOpenAiPayload(messages, tools)
        };
        request.Content = new StringContent(JsonSerializer.Serialize(payload), Encoding.UTF8, "application/json");
        return request;
    }

    private object BuildOpenAiPayload(IReadOnlyList<AgentMessage> messages, IReadOnlyList<AgentToolDefinition>? tools)
    {
        var msg = messages.Select(m => new Dictionary<string, object?>
        {
            ["role"] = m.Role,
            ["content"] = m.Content,
            ["tool_call_id"] = m.ToolCallId,
            ["tool_calls"] = m.ToolCalls?.Select(c => new { id = c.Id, type = "function", function = new { name = c.Name, arguments = c.ArgumentsJson } }).ToArray()
        }).ToArray();
        var payload = new Dictionary<string, object?> { ["model"] = Options.Model, ["messages"] = msg, ["max_tokens"] = Options.MaxTokens };
        if (tools is { Count: > 0 }) payload["tools"] = tools.Select(t => new { type = "function", function = new { name = t.Name, description = t.Description, parameters = new { type = "object", properties = t.Parameters.ToDictionary(p => p.Key, p => new { type = p.Value.Type, description = p.Value.Description }), required = t.Required } } }).ToArray();
        return payload;
    }

    private object BuildAnthropicPayload(IReadOnlyList<AgentMessage> messages)
    {
        string? system = messages.FirstOrDefault(m => m.Role == "system")?.Content;
        var content = messages.Where(m => m.Role != "system").Select(m => new { role = m.Role == "assistant" ? "assistant" : "user", content = m.Content ?? string.Empty }).ToArray();
        var payload = new Dictionary<string, object?> { ["model"] = Options.Model, ["max_tokens"] = Options.MaxTokens, ["messages"] = content };
        if (!string.IsNullOrWhiteSpace(system)) payload["system"] = system;
        return payload;
    }

    private object BuildGeminiPayload(IReadOnlyList<AgentMessage> messages)
    {
        var contents = messages.Where(m => m.Role != "system").Select(m => new { role = m.Role == "assistant" ? "model" : "user", parts = new[] { new { text = m.Content ?? string.Empty } } }).ToArray();
        var system = messages.FirstOrDefault(m => m.Role == "system")?.Content;
        var payload = new Dictionary<string, object?> { ["contents"] = contents, ["generationConfig"] = new { maxOutputTokens = Options.MaxTokens } };
        if (!string.IsNullOrWhiteSpace(system)) payload["systemInstruction"] = new { parts = new[] { new { text = system } } };
        return payload;
    }

    private AgentChatResponse ParseResponse(string body)
    {
        try
        {
            using var doc = JsonDocument.Parse(body);
            var root = doc.RootElement;
            if (Options.ApiFormat == UniversalAI.UniversalApiFormat.AnthropicMessages)
            {
                string text = root.TryGetProperty("content", out var c) && c.ValueKind == JsonValueKind.Array ? string.Join("", c.EnumerateArray().Where(x => x.TryGetProperty("text", out _)).Select(x => x.GetProperty("text").GetString())) : string.Empty;
                return new AgentChatResponse { Content = text };
            }
            if (Options.ApiFormat == UniversalAI.UniversalApiFormat.GeminiGenerateContent)
            {
                string text = string.Empty;
                if (root.TryGetProperty("candidates", out var candidates) && candidates.ValueKind == JsonValueKind.Array && candidates.GetArrayLength() > 0)
                {
                    var parts = candidates[0].GetProperty("content").GetProperty("parts");
                    text = string.Join("", parts.EnumerateArray().Where(x => x.TryGetProperty("text", out _)).Select(x => x.GetProperty("text").GetString()));
                }
                return new AgentChatResponse { Content = text };
            }
            var choice = root.GetProperty("choices")[0];
            var message = choice.GetProperty("message");
            var result = new AgentChatResponse { Content = message.TryGetProperty("content", out var content) ? content.GetString() : string.Empty };
            if (message.TryGetProperty("tool_calls", out var calls) && calls.ValueKind == JsonValueKind.Array)
            {
                result.ToolCalls = new List<AgentToolCall>();
                foreach (var call in calls.EnumerateArray())
                {
                    var fn = call.GetProperty("function");
                    result.ToolCalls.Add(new AgentToolCall { Id = call.GetProperty("id").GetString() ?? Guid.NewGuid().ToString("N"), Name = fn.GetProperty("name").GetString() ?? string.Empty, ArgumentsJson = fn.GetProperty("arguments").GetString() ?? "{}" });
                }
            }
            return result;
        }
        catch (Exception ex)
        {
            return new AgentChatResponse { Error = "Resposta inválida do provedor: " + ex.Message, ErrorKind = AgentErrorKind.InvalidRequest };
        }
    }

    private void ApplyCustomHeaders(HttpRequestMessage request)
    {
        try
        {
            using var doc = JsonDocument.Parse(Options.HeadersJson ?? "{}");
            if (doc.RootElement.ValueKind == JsonValueKind.Object)
                foreach (var p in doc.RootElement.EnumerateObject())
                    if (p.Value.ValueKind == JsonValueKind.String) request.Headers.TryAddWithoutValidation(p.Name, p.Value.GetString());
        }
        catch (JsonException ex) { _logger.Warning("Cabeçalhos personalizados inválidos: " + ex.Message); }
    }

    private void EnsureConfigured()
    {
        if (string.IsNullOrWhiteSpace(Options.BaseUrl)) throw new InvalidOperationException("Endpoint do provedor não configurado.");
        if (string.IsNullOrWhiteSpace(Options.Model)) throw new InvalidOperationException("Modelo não configurado.");
        if (Options.ApiKeyLocation != UniversalAI.UniversalApiKeyLocation.None && string.IsNullOrWhiteSpace(Options.ApiKey)) throw new InvalidOperationException("API key não configurada.");
    }

    private static AgentErrorKind Classify(HttpStatusCode code) => code switch
    {
        HttpStatusCode.BadRequest => AgentErrorKind.InvalidRequest,
        HttpStatusCode.Unauthorized or HttpStatusCode.Forbidden => AgentErrorKind.InvalidApiKey,
        (HttpStatusCode)402 => AgentErrorKind.PaymentRequired,
        HttpStatusCode.TooManyRequests => AgentErrorKind.RateLimited,
        _ when (int)code >= 500 => AgentErrorKind.ProviderError,
        _ => AgentErrorKind.Unknown
    };
}
