name: Rebuild Universal AI Runtime

on:
  push:
    branches:
      - migration/universal-ai-clean

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Rebuild universal source
        run: python3 scripts/rebuild-universal-ai.py

      - name: Build solution
        run: dotnet build AURA.sln --configuration Release

      - name: Verify vendor-neutral source
        run: |
          if grep -RniE 'OpenRouter|OPENROUTER|qwen/qwen-plus|gpt-5-mini|127\.0\.0\.1:1143[0-9]' src config modules tests --exclude-dir=bin --exclude-dir=obj; then
            echo 'Vendor-specific reference remains in source.'
            exit 1
          fi

      - name: Commit reconstructed source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'refactor(ai): make provider runtime fully user-configurable'
          git push origin HEAD:${GITHUB_REF_NAME}
