name: Cleanup GitHub Actions storage

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

concurrency:
  group: aura-actions-cleanup
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Clean old runs, artifacts and caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cleanup Actions storage
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runDays = 7;
            const cacheDays = 7;
            const now = Date.now();
            const runCutoff = now - runDays * 24 * 60 * 60 * 1000;
            const cacheCutoff = now - cacheDays * 24 * 60 * 60 * 1000;
            const currentRunId = context.runId;

            let artifactsDeleted = 0;
            let runsDeleted = 0;
            let cachesDeleted = 0;

            const artifacts = [];
            for (let page = 1; ; page++) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner, repo, per_page: 100, page
              });
              artifacts.push(...data.artifacts);
              if (data.artifacts.length < 100) break;
            }

            for (const artifact of artifacts) {
              await github.rest.actions.deleteArtifact({
                owner, repo, artifact_id: artifact.id
              });
              artifactsDeleted++;
            }

            const runs = [];
            for (let page = 1; ; page++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, per_page: 100, page
              });
              runs.push(...data.workflow_runs);
              if (data.workflow_runs.length < 100) break;
            }

            for (const run of runs) {
              const created = new Date(run.created_at).getTime();
              if (run.id !== currentRunId && created < runCutoff) {
                await github.rest.actions.deleteWorkflowRun({
                  owner, repo, run_id: run.id
                });
                runsDeleted++;
              }
            }

            const caches = [];
            for (let page = 1; ; page++) {
              const { data } = await github.rest.actions.getActionsCacheList({
                owner, repo, per_page: 100, page
              });
              caches.push(...data.actions_caches);
              if (data.actions_caches.length < 100) break;
            }

            for (const cache of caches) {
              const lastUsed = cache.last_accessed_at
                ? new Date(cache.last_accessed_at).getTime()
                : new Date(cache.created_at).getTime();
              if (lastUsed < cacheCutoff) {
                await github.rest.actions.deleteActionsCacheById({
                  owner, repo, cache_id: cache.id
                });
                cachesDeleted++;
              }
            }

            await core.summary
              .addHeading('AURA Actions cleanup')
              .addTable([
                [{data:'Resource',header:true},{data:'Policy',header:true},{data:'Deleted',header:true}],
                ['Artifacts','all existing artifacts',String(artifactsDeleted)],
                ['Workflow runs','older than 7 days',String(runsDeleted)],
                ['Caches','unused for 7 days',String(cachesDeleted)]
              ])
              .write();

            core.info(`Cleanup complete: ${artifactsDeleted} artifacts, ${runsDeleted} runs, ${cachesDeleted} caches deleted.`);
