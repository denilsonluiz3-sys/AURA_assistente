name: Cleanup old GitHub Actions artifacts

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Remove artifacts older than 7 days
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const retentionDays = 7;
            const cutoff = Date.now() - retentionDays * 24 * 60 * 60 * 1000;

            let page = 1;
            let deleted = 0;
            let scanned = 0;

            while (true) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner,
                repo,
                per_page: 100,
                page,
              });

              if (data.artifacts.length === 0) break;

              for (const artifact of data.artifacts) {
                scanned++;
                const createdAt = new Date(artifact.created_at).getTime();
                const expired = artifact.expired === true;
                const old = createdAt < cutoff;

                if (!expired && old) {
                  await github.rest.actions.deleteArtifact({
                    owner,
                    repo,
                    artifact_id: artifact.id,
                  });
                  deleted++;
                  core.info(`Deleted artifact: ${artifact.name} (#${artifact.id})`);
                }
              }

              if (data.artifacts.length < 100) break;
              page++;
            }

            core.info(`Scanned ${scanned} artifacts; deleted ${deleted} artifacts older than ${retentionDays} days.`);
