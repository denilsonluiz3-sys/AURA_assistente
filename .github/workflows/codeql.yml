# CodeQL Advanced — análise C#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/ai/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/ai/**'
      - 'docs/**'
      - '**/*.md'
  schedule:
    - cron: '43 1 * * 6'

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: csharp
          build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 12266719
        accept-android-sdk-licenses: true
        packages: tools platform-tools

    - name: Install Android SDK components
      shell: bash
      run: |
        set -euo pipefail
        yes | sdkmanager --licenses >/dev/null || true
        sdkmanager --install \
          "platform-tools" \
          "platforms;android-36" \
          "build-tools;35.0.0" \
          "ndk;26.3.11579264" \
          "cmdline-tools;latest"

    - name: Install MAUI Android workload
      run: dotnet workload install maui-android

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Restore Mobile
      run: dotnet restore src/AURA.Mobile/AURA.Mobile.csproj

    - name: Manual build (csharp)
      if: matrix.build-mode == 'manual'
      shell: bash
      run: dotnet build src/AURA.Mobile/AURA.Mobile.csproj -c Release --no-restore

    - name: Perform CodeQL Analysis
      continue-on-error: true
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
