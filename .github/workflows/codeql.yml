# CodeQL Advanced — análise C#
# Se code scanning não estiver habilitado nas settings do repo, o job
# conclui com aviso (continue-on-error) para não poluir o status do PR/main.
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/ai/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/ai/**'
      - 'docs/**'
      - '**/*.md'
  schedule:
    - cron: '43 1 * * 6'

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: csharp
          build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Manual build (csharp)
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        # Solution completa pode falhar por projetos Windows; prioriza Mobile + libs
        dotnet build src/AURA.Mobile/AURA.Mobile.csproj -c Release || \
          dotnet build AURA.sln -c Release

    - name: Perform CodeQL Analysis
      continue-on-error: true
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
