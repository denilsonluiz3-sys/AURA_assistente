name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_GCHeapHardLimit: '1C0000000'
  DOTNET_GCHeapCount: '2'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Check executors
        run: |
          echo "Runtimes disponíveis para as células AURA:"
          dotnet --version
          python3 --version
          java -version 2>&1 | head -1
          node --version
          go version

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore AURA.sln

      - name: Build (Release)
        run: dotnet build AURA.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/AURA.Tests/AURA.Tests.csproj -c Release --no-build --verbosity normal

      - name: Run smoke test
        run: bash scripts/smoke-test.sh
