name: Apply CLI model runtime

on:
  push:
    branches: [fix/cli-model-runtime]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Helper script exists
        run: test -f scripts/configurar-aura-llm.sh

      - name: EnsureAiClient requires env (no hard-coded free model)
        run: |
          set -e
          grep -q 'AURA_PROVIDER' src/AURA.CLI/Program.cs
          grep -q 'AURA_MODEL' src/AURA.CLI/Program.cs
          grep -q 'AURA_BASE_URL' src/AURA.CLI/Program.cs
          grep -q 'case "modelos"' src/AURA.CLI/Program.cs

      - name: No forbidden hard-coded defaults in CLI/AI options
        run: |
          set -e
          # Modelo antigo forçado no CLI
          if grep -n 'qwen/qwen-plus' src/AURA.CLI/Program.cs; then
            echo "FAIL: qwen/qwen-plus ainda no CLI"
            exit 1
          fi
          # Defaults de Options devem ser vazios (config explícita)
          if grep -n 'public string Model { get; set; } = "qwen' src/AURA.AI/OpenRouterClient.cs; then
            echo "FAIL: Model default qwen"
            exit 1
          fi
          echo "OK: validação CLI model runtime"
