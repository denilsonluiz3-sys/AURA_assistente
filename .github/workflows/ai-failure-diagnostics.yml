name: AURA AI Failure Diagnostics

on:
  # Só workflows de build/análise reais — evita cascata por docs/sync.
  workflow_run:
    workflows:
      - AURA Android APK
      - CodeQL Advanced
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run ID to inspect'
        required: true
        type: string

concurrency:
  group: aura-ai-failure-diagnostics-${{ github.event.workflow_run.id || github.event.inputs.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Collect complete CI context
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ github.event.inputs.run_id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          RUN_ID="${EVENT_RUN_ID:-${INPUT_RUN_ID:-}}"
          test -n "$RUN_ID" || { echo 'run_id ausente' >&2; exit 1; }

          mkdir -p docs/ai/ci-failures

          # Campo "artifacts" não existe em `gh run view --json` (API atual).
          gh run view "$RUN_ID" --repo "$REPOSITORY" --json \
            databaseId,name,displayTitle,status,conclusion,headBranch,headSha,event,createdAt,updatedAt,url,workflowName,jobs \
            > /tmp/run.json

          gh run view "$RUN_ID" --repo "$REPOSITORY" --log-failed > /tmp/failed.log 2>&1 || true

          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          run = json.loads(Path('/tmp/run.json').read_text())
          raw = Path('/tmp/failed.log').read_text(errors='replace')

          def gh_json(args):
              try:
                  out = subprocess.check_output(['gh', 'api', *args], text=True, stderr=subprocess.DEVNULL)
                  return json.loads(out)
              except Exception:
                  return None

          redactions = [
              (r'(?i)(authorization:\s*bearer\s+)[^\s]+', r'\1[REDACTED]'),
              (r'(?i)(password\s*[=:]\s*)[^\s]+', r'\1[REDACTED]'),
              (r'(?i)(token\s*[=:]\s*)[^\s]+', r'\1[REDACTED]'),
              (r'(?i)(api[_-]?key\s*[=:]\s*)[^\s]+', r'\1[REDACTED]'),
              (r'(?i)(secret\s*[=:]\s*)[^\s]+', r'\1[REDACTED]'),
              (r'(?i)(private[_-]?key\s*[=:]\s*)[^\s]+', r'\1[REDACTED]'),
          ]
          for pattern, repl in redactions:
              raw = re.sub(pattern, repl, raw)

          # Falhas de infraestrutura Actions (não são bugs de código).
          infra_patterns = [
              r'Artifact storage quota has been hit',
              r'Unable to upload any new artifacts',
              r'Code scanning is not enabled for this repository',
              r'configuration error',
              r'does not have permission to access the CodeQL',
          ]
          infra_only = any(re.search(p, raw, re.I) for p in infra_patterns) and not re.search(
              r'\berror CS\d{4}\b|error XA\d+|error NETSDK\d+|error NU\d+', raw, re.I
          )

          lines = raw.splitlines()
          error_re = re.compile(
              r'\b(error|failed|failure|exception|fatal|NETSDK\d+|CS\d{4}|XA\d+|NU\d{4}|MSB\d{4})\b',
              re.I,
          )
          error_indexes = [i for i, line in enumerate(lines) if error_re.search(line)]

          if error_indexes:
              first = error_indexes[0]
              start = max(0, first - 8)
              end = min(len(lines), first + 40)
              evidence_lines = lines[start:end]
              if len(error_indexes) > 1:
                  evidence_lines += ['', '--- additional failure markers ---']
                  for idx in error_indexes[1:20]:
                      evidence_lines.append(lines[idx])
              key = '\n'.join(evidence_lines)
          elif lines:
              key = '\n'.join(lines[-160:])
          else:
              key = 'Nenhum log de falha foi disponibilizado pelo GitHub para esta execução.'

          workflow = run.get('workflowName') or run.get('name') or 'unknown'
          conclusion = run.get('conclusion') or 'unknown'
          branch = run.get('headBranch') or 'unknown'
          sha = run.get('headSha') or 'unknown'
          run_id = str(run.get('databaseId') or os.environ.get('EVENT_RUN_ID') or 'unknown')

          def classify(text, infra):
              if infra:
                  return 'Infraestrutura GitHub Actions (quota/artifact/CodeQL config) — não é falha de código.'
              checks = [
                  ('C# / compilação', r'CS\d{4}|compil|namespace|does not exist|cannot be declared'),
                  ('XAML / source generator', r'XAML|SourceGen|sg\.cs|XamlGenerator'),
                  ('MAUI workload / SDK', r'NETSDK1147|maui-android|workload'),
                  ('Android SDK / NDK / Java', r'ANDROID|XA\d+|sdkmanager|NDK|JDK|Java'),
                  ('NuGet / restore', r'NU\d{4}|restore|NuGet|package'),
                  ('GitHub Actions / configuração', r'workflow|permission|actions/|runner|YAML|yaml|Artifact storage'),
                  ('CodeQL / segurança', r'CodeQL|code scanning|security'),
              ]
              for name, pattern in checks:
                  if re.search(pattern, text, re.I):
                      return name
              return 'Indeterminada — consultar o primeiro erro real do log.'

          category = classify(key, infra_only)

          jobs = run.get('jobs') or []
          failed_jobs = [j for j in jobs if j.get('conclusion') not in (None, 'success', 'skipped')]
          relevant_jobs = failed_jobs or jobs

          job_lines = []
          step_lines = []
          for job in relevant_jobs:
              job_name = job.get('name') or job.get('id') or 'unknown'
              job_lines.append(
                  f"- `{job_name}` — conclusion=`{job.get('conclusion')}`, status=`{job.get('status')}`"
              )
              for step in job.get('steps') or []:
                  if step.get('conclusion') not in (None, 'success', 'skipped'):
                      step_lines.append(
                          f"- `{job_name}` → `{step.get('name', 'unknown')}` — conclusion=`{step.get('conclusion')}`"
                      )

          if not job_lines:
              job_lines = ['- Nenhum job foi retornado pela API do GitHub.']
          if not step_lines:
              step_lines = ['- Nenhuma etapa com falha foi retornada. Consulte a URL da execução.']

          commit_files = gh_json([f'repos/{repo}/commits/{sha}']) if sha != 'unknown' else None
          changed_files = []
          if isinstance(commit_files, dict):
              changed_files = [f.get('filename') for f in commit_files.get('files', []) if f.get('filename')]
          changed_files = changed_files[:200]
          changed_file_lines = [f'- `{f}`' for f in changed_files] or ['- Não foi possível obter a lista de arquivos do commit.']

          prs = gh_json([f'repos/{repo}/commits/{sha}/pulls', '-H', 'Accept: application/vnd.github+json']) if sha != 'unknown' else None
          pr_lines = []
          if isinstance(prs, list):
              for pr in prs[:20]:
                  pr_lines.append(
                      f"- PR #{pr.get('number')}: {pr.get('title', 'unknown')} — {pr.get('html_url', '')}"
                  )
          if not pr_lines:
              pr_lines = ['- Nenhum PR associado ao commit.']

          skip_publish = infra_only
          Path('/tmp/skip_publish').write_text('1' if skip_publish else '0')

          report = f'''# Falha CI — {workflow} — run {run_id}\n\n'''
          report += f'''## Identidade da execução\n\n- Workflow: `{workflow}`\n- Run ID: `{run_id}`\n- Status: `{run.get('status', 'unknown')}`\n- Conclusão: `{conclusion}`\n- Branch: `{branch}`\n- Commit: `{sha}`\n- Evento: `{run.get('event', 'unknown')}`\n- Criado: `{run.get('createdAt', 'unknown')}`\n- Atualizado: `{run.get('updatedAt', 'unknown')}`\n- URL: {run.get('url', '')}\n- Categoria provável: **{category}**\n- Infra-only (não publicar commit): `{skip_publish}`\n\n'''
          report += '## Jobs relevantes\n\n' + '\n'.join(job_lines) + '\n\n'
          report += '## Etapas com falha\n\n' + '\n'.join(step_lines) + '\n\n'
          report += '## Pull requests associados\n\n' + '\n'.join(pr_lines) + '\n\n'
          report += '## Arquivos alterados no commit\n\n' + '\n'.join(changed_file_lines) + '\n\n'
          report += '''## Procedimento obrigatório para uma IA\n\n1. Trate o GitHub como fonte de verdade.\n2. Leia `README_AI.md` antes de alterar código.\n3. Ignore falhas de quota de artifact / CodeQL desabilitado — não são bugs de produto.\n4. Localize o primeiro erro causal de compilação/código.\n5. Faça a menor correção e valide no Actions.\n\n'''
          report += '## Evidência do log\n\n```text\n' + key[-18000:] + '\n```\n'

          latest = Path('docs/ai/CI_FAILURE_LATEST.md')
          history = Path('docs/ai/ci-failures') / f'{run_id}.md'
          latest.write_text(report, encoding='utf-8')
          history.write_text(report, encoding='utf-8')

          context = {
              'repository': repo,
              'workflow': workflow,
              'run_id': run_id,
              'status': run.get('status'),
              'conclusion': conclusion,
              'branch': branch,
              'commit': sha,
              'event': run.get('event'),
              'url': run.get('url'),
              'category': category,
              'infra_only': skip_publish,
              'failed_jobs': [j.get('name') for j in failed_jobs],
              'failed_steps': [
                  {'job': j.get('name'), 'step': s.get('name'), 'conclusion': s.get('conclusion')}
                  for j in relevant_jobs for s in (j.get('steps') or [])
                  if s.get('conclusion') not in (None, 'success', 'skipped')
              ],
              'changed_files': changed_files,
              'associated_prs': [p.get('number') for p in prs] if isinstance(prs, list) else [],
              'diagnostic_report': f'docs/ai/ci-failures/{run_id}.md',
          }
          Path('docs/ai/CI_FAILURE_LATEST.json').write_text(
              json.dumps(context, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Publish diagnostic context
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat /tmp/skip_publish 2>/dev/null || echo 0)" = "1" ]; then
            echo 'Falha de infraestrutura (quota/CodeQL config). Não publica commit no main.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ai/CI_FAILURE_LATEST.md docs/ai/CI_FAILURE_LATEST.json docs/ai/ci-failures/
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração de diagnóstico para publicar.'
            exit 0
          fi
          git commit -m "docs(ai): record CI failure context"
          git push origin HEAD:main
