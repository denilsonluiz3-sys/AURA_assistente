name: AURA Sync Main

# Sincronização sob demanda. Não executar automaticamente em push na main.
on:
  workflow_dispatch:

concurrency:
  group: aura-sync-main
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update open PR branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --state open --base main --limit 100 --json number,headRefName,headRepositoryOwner --jq '.[] | select(.headRepositoryOwner.login == "${{ github.repository_owner }}") | [.number,.headRefName] | @tsv' > /tmp/prs.tsv

          while IFS=$'\t' read -r number branch; do
            [ -z "${branch:-}" ] && continue
            echo "Updating PR #$number ($branch)"
            gh pr update-branch "$number" --rebase || echo "::warning::Could not update PR #$number"
          done < /tmp/prs.tsv

      - name: Update active feature/fix branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          git for-each-ref --format='%(refname:short)' refs/remotes/origin/ \
            | sed 's#^origin/##' \
            | grep -E '^(feat|fix|refactor|agent)/' \
            | grep -v '^main$' \
            > /tmp/feature-branches.txt || true

          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            echo "Synchronizing $branch with main"
            git checkout -B "$branch" "origin/$branch"

            if git merge-base --is-ancestor origin/main HEAD; then
              echo "$branch is already based on main"
              continue
            fi

            if git merge --no-edit origin/main; then
              git push origin "HEAD:$branch"
            else
              echo "::warning::Conflict on $branch; leaving it unchanged for manual resolution"
              git merge --abort || true
            fi
          done < /tmp/feature-branches.txt
