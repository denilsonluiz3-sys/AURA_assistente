name: AURA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

concurrency:
  group: aura-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate AURA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: aura-nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            aura-nuget-${{ runner.os }}-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore solution
        run: dotnet restore AURA.sln

      - name: Build solution
        run: dotnet build AURA.sln -c Release --no-restore --nologo

      - name: Test
        run: dotnet test tests/AURA.Tests/AURA.Tests.csproj -c Release --no-build --verbosity normal

      - name: Build Android
        run: dotnet build src/AURA.Mobile/AURA.Mobile.csproj -c Release --no-restore --nologo -f net10.0-android

      - name: Smoke test
        if: hashFiles('scripts/smoke-test.sh') != ''
        run: bash scripts/smoke-test.sh

  auto-merge:
    name: Enable auto-merge
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
