# CI + optional auto-merge workflow for feature branches / PRs
name: CI and Optional Auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to operate on (required for manual auto-merge)'
        required: false
      auto_merge:
        description: 'If "true", attempt to auto-merge after successful CI'
        required: false
        default: 'false'

permissions:
  contents: read
  pull-requests: write
  actions: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_GCHeapHardLimit: '1C0000000'
  DOTNET_GCHeapCount: '2'

jobs:
  build-and-test:
    name: Build and Test (.NET 10 + MAUI Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Android SDK
        run: |
          ANDROID_SDK=/usr/local/lib/android/sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore AURA.sln

      - name: Restore MAUI Android packages
        run: dotnet restore src/AURA.Mobile/AURA.Mobile.csproj

      - name: Build
        run: dotnet build AURA.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/AURA.Tests/AURA.Tests.csproj -c Release --no-build --verbosity normal

      - name: Smoke test
        run: bash scripts/smoke-test.sh

  auto-merge:
    name: Auto-merge PR (optional)
    needs: build-and-test
    runs-on: ubuntu-latest
    if: needs.build-and-test.result == 'success'
    steps:
      - name: Determine PR number and whether to merge
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          PR_NUM=""
          SHOULD_MERGE="false"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            labels=$(gh pr view "$PR_NUM" --json labels --jq '.labels[].name' || true)
            if printf '%s\n' "$labels" | grep -qx 'auto-merge'; then
              SHOULD_MERGE="true"
            fi
          else
            PR_NUM="${{ github.event.inputs.pr_number }}"
            if [ -n "$PR_NUM" ] && [ "${{ github.event.inputs.auto_merge }}" = "true" ]; then
              SHOULD_MERGE="true"
            fi
          fi

          echo "should_merge=$SHOULD_MERGE" >> "$GITHUB_OUTPUT"
          echo "pr_num=$PR_NUM" >> "$GITHUB_OUTPUT"

      - name: Login gh with PAT (if available)
        if: ${{ steps.decide.outputs.should_merge == 'true' }}
        env:
          COPILOT_PAT: ${{ secrets.COPILOT_PAT }}
        run: |
          if [ -z "$COPILOT_PAT" ]; then
            echo "COPILOT_PAT secret not found. Skipping auto-merge."
            exit 0
          fi
          echo "$COPILOT_PAT" | gh auth login --with-token

      - name: Try auto-merge
        if: ${{ steps.decide.outputs.should_merge == 'true' }}
        env:
          PR: ${{ steps.decide.outputs.pr_num }}
        run: |
          set -e
          gh pr view "$PR" --json number,title,author,headRefName,headRepositoryOwner,headRepository
          gh pr merge "$PR" --squash --delete-branch

      - name: Skip message when not merging
        if: ${{ steps.decide.outputs.should_merge != 'true' }}
        run: echo "Auto-merge not requested or conditions not met; no merge performed."
